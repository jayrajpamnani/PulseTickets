server: { port: 8080 }
spring:
  config: { import: "optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}" }
  application: { name: api-gateway }
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations: { '[/**]': { allowedOrigins: ['${WEB_ORIGIN:http://localhost:4200}'], allowedMethods: ['GET','POST','PUT','DELETE','OPTIONS'], allowedHeaders: ['*'] } }
      routes:
        - { id: auth, uri: "${USER_SERVICE_URL:http://user-service:8081}", predicates: [ "Path=/api/auth/**" ] }
        - { id: users, uri: "${USER_SERVICE_URL:http://user-service:8081}", predicates: [ "Path=/api/users/**" ] }
        - { id: event, uri: "${EVENT_SERVICE_URL:http://event-service:8082}", predicates: [ Path=/api/events/** ] }
        - { id: ticket, uri: "${TICKET_SERVICE_URL:http://ticket-service:8083}", predicates: [ Path=/api/reservations/** ] }
        - { id: payment, uri: "${PAYMENT_SERVICE_URL:http://payment-service:8084}", predicates: [ Path=/api/payments/** ] }
management: { endpoints: { web: { exposure: { include: health,info,prometheus } } } }
app: { jwt: { secret: "${JWT_SECRET:change-me-change-me-change-me-change-me}" } }
