groups:
  - name: event-ticketing
    rules:
      - alert: ServiceDown
        expr: up{job="event-ticketing-services"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Event-ticketing service is down"
      - alert: HighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (instance) > 0.1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Elevated HTTP 5xx rate"
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, instance)) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "HTTP p95 latency exceeds one second"
