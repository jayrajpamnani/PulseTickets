name: validate-build-deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify backend and infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check git whitespace and diff
        run: git diff --check origin/main..HEAD || git diff --check || true
      - name: Validate YAML configuration files
        run: |
          python3 -c "import yaml, glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob('k8s/*.yaml') + glob.glob('monitoring/*.yml') + glob.glob('.github/workflows/*.yml')]"
      - name: Lint Dockerfiles
        run: |
          for df in $(find . -name "Dockerfile" -not -path "*/node_modules/*"); do
            echo "Linting $df..."
            grep -q "^FROM" "$df" || (echo "Error: $df missing FROM instruction" && exit 1)
          done
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: hashicorp/setup-terraform@v3
      - run: mvn --batch-mode verify
      - name: Archive Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: '**/target/surefire-reports/'
      - run: terraform -chdir=infra/terraform fmt -check -recursive

  frontend:
    name: Build Angular frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: web

  deploy-production:
    name: Build images and deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      IMAGE_TAG: sha-${{ github.sha }}
      TF_VAR_aws_region: us-east-2
      TF_VAR_project: pulse-tickets
      TF_VAR_alert_email: jayrajpamnani1610@gmail.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/setup-kubectl@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::262517452778:role/pulse-tickets-github-actions-production
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable service images
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          for service in api-gateway user-service event-service ticket-service payment-service notification-service analytics-service config-server; do
            docker build -f "$service/Dockerfile" -t "$ECR_REGISTRY/pulse-tickets/$service:$IMAGE_TAG" .
            docker push "$ECR_REGISTRY/pulse-tickets/$service:$IMAGE_TAG"
          done
      - name: Build frontend artifact
        run: npm ci && npm run build
        working-directory: web
      - name: Build banner processor artifact
        run: mvn --batch-mode -pl banner-processor -am clean package
      - name: Deploy EKS workloads and web edge
        run: |
          # ubuntu-latest already ships gettext/envsubst. Avoid an unconditional
          # apt mirror refresh, which can hang the deployment runner.
          if ! command -v envsubst >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y gettext-base
          fi
          chmod +x scripts/deploy-production.sh
          scripts/deploy-production.sh
